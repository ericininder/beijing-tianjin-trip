const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cardHtml(c) {
  const tag = c.ol ? 'ol' : 'ul';
  const lines = c.lines && c.lines.length ? `<${tag}>${c.lines.map(x => `<li>${x}</li>`).join('')}</${tag}>` : '';
  const callout = c.callout ? `<div class="callout"><span>🔔</span><span>${esc(c.callout)}</span></div>` : '';
  const maps = c.maps && c.maps.length ? `<div class="maps">${c.maps.map(([n, q]) => `<a class="map-link" href="${esc(M(q))}" target="_blank" rel="noopener"><span>📍 ${esc(n)}</span><span>↗</span></a>`).join('')}</div>` : '';
  const links = c.links && c.links.length ? `<div class="inner-links">${c.links.map(([l, h]) => `<a class="btn soft" href="${esc(h)}">${esc(l)} →</a>`).join('')}</div>` : '';
  return `<article class="card${c.wide ? ' wide' : ''}"><div class="card-head"><h3>${esc(c.title)}</h3>${c.badge ? `<span class="badge">${esc(c.badge)}</span>` : ''}</div><div class="card-body">${lines}${callout}${maps}${links}</div></article>`;
}
document.getElementById('chips').innerHTML = SECTIONS.map(s => `<a class="chip" href="#${s.id}">${s.icon} ${esc(s.chip || s.title)}</a>`).join('');
document.getElementById('root').innerHTML = SECTIONS.map(s => `<section class="block" id="${s.id}"><div class="block-head"><span class="ico">${s.icon}</span><div><h2>${esc(s.title)}</h2>${s.sub ? `<p>${esc(s.sub)}</p>` : ''}</div></div><div class="cards">${s.cards.map(cardHtml).join('')}</div></section>`).join('');
if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }

</script>
