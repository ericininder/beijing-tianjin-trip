<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>行前資訊｜北京 × 天津 8日自由行</title>
<style>
:root{--sky:#dff6ff;--navy:#0b3766;--navy2:#082a50;--blue:#1e6799;--cream:#fff7e8;--line:#bde9f7;--orange:#f3a044;--shadow:0 14px 40px rgba(9,50,93,.14);--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--navy2);background:linear-gradient(180deg,var(--sky),#f7fcff 42%,#fff)}
a{color:inherit}.app{max-width:1040px;margin:0 auto;padding:18px 16px 72px}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:26px 20px 22px;background:radial-gradient(circle at 10% 12%,#fff 0 7%,transparent 23%),linear-gradient(135deg,#bdefff,#f7fbff 70%);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.85)}
.hero:before{content:"";position:absolute;inset:0;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160" viewBox="0 0 320 160"><path d="M16 60 C70 10 112 120 178 56 C222 14 258 32 306 14" fill="none" stroke="rgba(11,55,102,.18)" stroke-width="3" stroke-dasharray="8 10"/><text x="268" y="28" font-size="24">✈</text><text x="28" y="132" font-size="22">✦</text><text x="218" y="126" font-size="18">✦</text></svg>') center/cover no-repeat;opacity:.75}
.hero>*{position:relative}.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.72);color:var(--blue);font-weight:900;letter-spacing:.08em}
h1{margin:14px 0 6px;font-size:clamp(2rem,6vw,4rem);line-height:1.05;letter-spacing:.03em;color:var(--navy);text-shadow:0 2px 0 rgba(255,255,255,.65)}
.hero p{margin:0;color:#31516c;line-height:1.7;font-weight:700}
.top-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:12px 16px;border-radius:999px;text-decoration:none;border:1px solid rgba(10,55,101,.12);background:#fff;color:var(--navy);font-weight:950;box-shadow:0 8px 20px rgba(12,60,110,.10);cursor:pointer;font-size:1rem}
.btn.primary{background:linear-gradient(135deg,var(--navy),#17669a);color:#fff;border-color:transparent}.btn.soft{background:#eefaff}
.chips-wrap{position:sticky;top:0;z-index:20;margin:12px -16px 4px;padding:10px 0;background:linear-gradient(180deg,rgba(230,248,255,.98),rgba(247,252,255,.92));backdrop-filter:blur(14px);border-bottom:1px solid rgba(11,55,102,.06)}
.chips{display:flex;gap:8px;overflow:auto;padding:0 16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:#fff;color:var(--navy);font-weight:950;text-decoration:none;box-shadow:0 5px 16px rgba(10,55,101,.09);font-size:.95rem}
.block{margin-top:22px}
.block-head{display:flex;align-items:center;gap:12px;margin:0 4px 12px}
.block-head .ico{display:grid;place-items:center;width:46px;height:46px;border-radius:16px;background:var(--cream);border:1px solid rgba(11,55,102,.1);font-size:1.4rem;flex:0 0 auto}
.block-head h2{margin:0;color:var(--navy);font-size:clamp(1.3rem,4vw,1.8rem)}
.block-head p{margin:2px 0 0;color:#4f6478;font-weight:700;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:rgba(255,255,255,.92);border:1px solid rgba(190,232,247,.9);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card-head{padding:16px 18px 12px;background:linear-gradient(135deg,#fff,#eaf9ff);border-bottom:1px solid var(--line)}
.card-head h3{margin:0;color:var(--navy);font-size:1.15rem;font-weight:1000;line-height:1.4}
.badge{display:inline-flex;margin-top:8px;padding:4px 10px;border-radius:999px;background:var(--cream);border:1px solid rgba(243,160,68,.35);color:#7a4a10;font-weight:900;font-size:.88rem}
.card-body{padding:14px 18px 16px;display:grid;gap:12px}
.card-body ul,.card-body ol{margin:0;padding-left:1.2rem;line-height:1.7;color:#244963;font-weight:720}
.card-body li{margin:3px 0}
.card-body li strong{color:var(--navy)}
.callout{display:flex;gap:10px;padding:10px 12px;background:#fff7e8;border:1px solid rgba(243,160,68,.3);border-radius:14px;color:#5a3a10;font-weight:850;line-height:1.6}
.maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.map-link{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:14px;text-decoration:none;background:#eefaff;border:1px solid var(--line);font-weight:950;color:var(--navy);font-size:.95rem;line-height:1.35}
.map-link span:last-child{color:#2d85bd;flex:0 0 auto}
.inner-links{display:flex;flex-wrap:wrap;gap:8px}
.inner-links .btn{min-height:40px;padding:9px 14px;font-size:.95rem}
.footer{margin-top:22px;text-align:center;color:#45677c;line-height:1.7;font-weight:650}
@media(max-width:780px){.app{padding:12px 12px 72px}.hero{border-radius:24px;padding:22px 16px}.chips-wrap{margin-left:-12px;margin-right:-12px}.cards{grid-template-columns:1fr}.btn{flex:1 1 140px}}
@media(max-width:420px){.maps{grid-template-columns:1fr}}
@media print{.chips-wrap,.top-actions,.inner-links{display:none!important}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="hero">
  <div class="eyebrow">TRIP INFO｜行前資訊</div>
  <h1>行前資訊</h1>
  <p>整理自 115/10/03 22:00 版行程：航班、機場進市區、住宿、熱門景點預約規範、攜帶物品與換匯。地點都附 Google Maps 連結。</p>
  <div class="top-actions">
    <a class="btn primary" href="./index.html">← 回行程首頁</a>
    <a class="btn soft" href="./guide.html">🗺️ 景點攻略</a>
    <a class="btn soft" href="./todo.html">✅ To-Do List</a>
  </div>
</header>
<div class="chips-wrap"><nav class="chips" id="chips" aria-label="章節"></nav></div>
<main id="root"></main>
<footer class="footer">票價、開放時間與預約規則以官方最新公告為準。</footer>
</div>
<script>
const M = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);

const SECTIONS = [
{
  id: 'flights', icon: '✈️', title: '航班', sub: '中華航空 A321neo（中型，經濟艙含餐點）',
  cards: [
    { title: '去程｜11/3（二）CI517', badge: '13:30 桃園機場華航櫃台集合', lines: ['<strong>15:35</strong> 桃園機場 T2 起飛', '<strong>18:55</strong> 抵達北京首都國際機場 T3', '飛行約 3 小時 20 分'], maps: [['桃園機場第二航廈', '桃園國際機場第二航廈'], ['北京首都機場 T3', '北京首都國際機場T3航站樓']] },
    { title: '回程｜11/10（二）CI518', badge: '建議起飛前約 3 小時抵達機場', lines: ['<strong>20:25</strong> 北京首都國際機場 T3 起飛', '<strong>23:50</strong> 抵達桃園機場 T2', '飛行約 3 小時 25 分'], maps: [['北京首都機場 T3', '北京首都國際機場T3航站樓'], ['桃園機場第二航廈', '桃園國際機場第二航廈']] }
  ]
},
{
  id: 'transfer', icon: '🚇', title: '機場進市區', sub: '第 1 天抵達後，從首都機場到江蘇飯店',
  cards: [
    { title: '北京一卡通', lines: ['在機場地鐵站購買，<strong>¥100</strong>（押金 ¥20＋儲值 ¥80）', '押金與餘額可退，回程記得辦理'] },
    { title: '機場快線（機場快軌）', lines: ['出關後依「地鐵機場線 Airport Express」指標，前往 <strong>3 號停車樓</strong>，一次安檢後搭乘', '單程 <strong>¥25</strong>，約每 10 分鐘一班', '全線 4 站：3 號航站樓、1・2 號航站樓、三元橋、東直門'] },
    { title: '東直門 → 江蘇飯店', wide: true, ol: true, lines: ['機場快線坐到終點東直門站（也可在這裡改搭計程車）', '轉地鐵 2 號線到雍和宮站', '再轉地鐵 5 號線到和平里北街站下車', '步行前往江蘇飯店'], maps: [['東直門站', '東直門站 北京'], ['雍和宮站', '雍和宮站'], ['和平里北街站', '和平里北街站'], ['江蘇飯店', '江蘇飯店 北京']] }
  ]
},
{
  id: 'hotels', icon: '🏨', title: '住宿飯店', sub: '前 4 晚住北邊（安定門），後 3 晚住南邊（珠市口、前門）',
  cards: [
    { title: '江蘇飯店', badge: '4 晚｜11/3–11/6', lines: ['<strong>地址：</strong>北京市東城區安定門外大街丁 88 號（另見：朝陽區安定門外大街甲 1 號）', '<strong>地鐵：</strong>2 號線安定門站、5 號線和平里北街站', '<strong>周邊：</strong>地壇公園、雍和宮（約 2.1 公里）、簋街；到紫禁城、王府井車程約 5–15 分鐘'], maps: [['江蘇飯店', '江蘇飯店 北京'], ['安定門站', '安定門站 北京'], ['和平里北街站', '和平里北街站'], ['地壇公園', '地壇公園']] },
    { title: '萬達美華飯店', badge: '3 晚｜11/7–11/9', lines: ['<strong>地址：</strong>北京市東城區珠市口東大街 19 號', '<strong>地鐵：</strong>7 號線橋灣站步行約 4 分鐘、磁器口站；7 / 8 號線珠市口站（前門大街中段）', '<strong>周邊：</strong>步行可到前門大街；開車約 5 分鐘到王府井、紫禁城、天安門', '珠市口有軌電車站（鐺鐺車觀光線，北起前門、南至珠市口）步行約 10 分鐘；北京新世界商場步行約 18 分鐘'], maps: [['萬達美華飯店', '萬達美華飯店 北京'], ['橋灣站', '橋灣站 北京'], ['珠市口站', '珠市口站 北京'], ['前門大街', '前門大街']] }
  ]
},
{
  id: 'booking', chip: '預約', icon: '🎫', title: '熱門景點預約規範', sub: '標示本次行程對應的日期，方便提早預約',
  cards: [
    { title: '故宮博物院（紫禁城）', badge: 'DAY 5｜11/7（六）', lines: ['<strong>強制提前預約，不售當日票</strong>，週一休館', '參觀日前 7 天開放預約，每晚 20:00 放票', '本國遊客用故宮博物院微信小程序；外籍人士用官方網站或持相關文件現場購票'], callout: '11/7 的票約在 10/31（六）晚上 20:00 開放，以官方公告為準。沒預約到可改在前一天預約太廟：門票 ¥2（通票 ¥10，可看享殿，比太和殿壯觀）。', maps: [['故宮博物院（午門）', '故宮博物院 午門'], ['太廟', '北京太廟']] },
    { title: '天安門廣場', badge: 'DAY 8｜11/10（二）', lines: ['免費，需在參觀日前 1–7 天用小程序預約'], callout: '11/10 參觀可在 11/3–11/9 之間預約，抵達北京後就能處理。', maps: [['天安門廣場', '天安門廣場']] },
    { title: '八達嶺長城', badge: 'DAY 2｜11/4（三）', lines: ['推薦線上預約門票及纜車（也支援現場購票）', '門票淡季 ¥35，60 歲以上免門票；北線纜車來回 ¥140'], maps: [['八達嶺長城', '八達嶺長城']], links: [['📖 八達嶺交通', './guide.html#badaling']] },
    { title: '恭王府', badge: 'DAY 4｜11/6（五）', lines: ['需線上購票或預約'], maps: [['恭王府', '恭王府']] },
    { title: '頤和園、天壇、北海', badge: 'DAY 6 / DAY 4 / DAY 7', lines: ['免強制預約，現場可購票'], maps: [['頤和園', '頤和園'], ['天壇公園', '天壇公園'], ['北海公園', '北海公園']] },
    { title: '其他（目前未排入行程）', lines: ['<strong>國家博物館：</strong>免費，參觀日前 7 天內預約', '<strong>慕田峪長城：</strong>推薦線上預約門票及纜車，最晚前一天 18:00 前', '<strong>圓明園：</strong>需線上購票或預約'], maps: [['國家博物館', '中國國家博物館'], ['慕田峪長城', '慕田峪長城'], ['圓明園', '圓明園']] }
  ]
},
{
  id: 'packing', icon: '🧳', title: '攜帶物品', sub: '可到 To-Do List 逐項勾選',
  cards: [
    { title: '證件與現金', lines: ['護照、台胞證、健保卡（備用相片）', '新台幣 20,000 元，或人民幣 4,000 元'] },
    { title: '電器與用品', lines: ['大陸用插座轉接頭', '相機（含電池）', '血糖機、溫度計、心跳機', '老花眼鏡、墨鏡'] },
    { title: '衣物與日用', lines: ['衣服、盥洗用具、藥品', '軟式拖鞋、泳裝', '洋傘、帽子、輕便雨衣'] },
    { title: '其他', lines: ['桌球拍', '摺疊式小椅子', '活動手杖'], links: [['✅ 打開 To-Do 勾選', './todo.html']] }
  ]
},
{
  id: 'money', chip: '換匯', icon: '💰', title: '換匯與小筆記', sub: '',
  cards: [
    { title: '換匯', lines: ['出發前兌換人民幣 1 萬元', '隨身現金：新台幣 20,000 元或人民幣 4,000 元', '北京一卡通 ¥100（含押金 ¥20）'], links: [['💱 價錢換算', './currency.html']] },
    { title: '小筆記', lines: ['北京一環底邊長 = 22 ÷ 2.7 = 8.15 公里（地圖 / 實地 ＝ 1 / 0.617）'] }
  ]
}
];

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cardHtml(c) {
  const tag = c.ol ? 'ol' : 'ul';
  const lines = c.lines && c.lines.length ? `<${tag}>${c.lines.map(x => `<li>${x}</li>`).join('')}</${tag}>` : '';
  const callout = c.callout ? `<div class="callout"><span>🔔</span><span>${esc(c.callout)}</span></div>` : '';
  const maps = c.maps && c.maps.length ? `<div class="maps">${c.maps.map(([n, q]) => `<a class="map-link" href="${esc(M(q))}" target="_blank" rel="noopener"><span>📍 ${esc(n)}</span><span>↗</span></a>`).join('')}</div>` : '';
  const links = c.links && c.links.length ? `<div class="inner-links">${c.links.map(([l, h]) => `<a class="btn soft" href="${esc(h)}">${esc(l)} →</a>`).join('')}</div>` : '';
  return `<article class="card${c.wide ? ' wide' : ''}"><div class="card-head"><h3>${esc(c.title)}</h3>${c.badge ? `<span class="badge">${esc(c.badge)}</span>` : ''}</div><div class="card-body">${lines}${callout}${maps}${links}</div></article>`;
}
document.getElementById('chips').innerHTML = SECTIONS.map(s => `<a class="chip" href="#${s.id}">${s.icon} ${esc(s.chip || s.title)}</a>`).join('');
document.getElementById('root').innerHTML = SECTIONS.map(s => `<section class="block" id="${s.id}"><div class="block-head"><span class="ico">${s.icon}</span><div><h2>${esc(s.title)}</h2>${s.sub ? `<p>${esc(s.sub)}</p>` : ''}</div></div><div class="cards">${s.cards.map(cardHtml).join('')}</div></section>`).join('');
if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
</script>
</body>
</html>
